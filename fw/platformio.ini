; CACTUSCAM — camera agent on the Seeed XIAO ESP32S3 Sense
; Same platform pin as barkcam: Arduino core 2.0.x legacy I2S PDM API.
[env:seeed_xiao_esp32s3]
platform          = espressif32@6.9.0
board             = seeed_xiao_esp32s3
framework         = arduino
board_build.arduino.memory_type = qio_opi    ; OPI PSRAM
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; Serial over native USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_DFU_ON_BOOT=0
upload_speed      = 115200
upload_flags      = --no-stub                 ; CRITICAL — USB-JTAG desyncs on stub baud switch
board_build.partitions = default_8MB.csv      ; 8 MB layout (app + spiffs)
monitor_speed     = 115200
